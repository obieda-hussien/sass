name: FulfillOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Backend tests
        working-directory: backend
        run: pytest -q

  web:
    name: Control tower build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run lint
      - name: Web session regression tests
        run: npm test
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        run: npm run build

  android:
    name: Android APKs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build debug and internal release APKs
        working-directory: android
        env:
          FULFILLOS_API_BASE_URL: https://fulfillos-nine.vercel.app/api
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Resolve Android version
        id: android_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare named APKs
        shell: bash
        env:
          APP_VERSION: ${{ steps.android_version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/FulfillOS-v${APP_VERSION}-debug.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/FulfillOS-v${APP_VERSION}-release.apk"
          ls -lh dist

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: FulfillOS-v${{ steps.android_version.outputs.version }}-debug
          path: dist/FulfillOS-v${{ steps.android_version.outputs.version }}-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: FulfillOS-v${{ steps.android_version.outputs.version }}-release
          path: dist/FulfillOS-v${{ steps.android_version.outputs.version }}-release.apk
          if-no-files-found: error
          retention-days: 30
