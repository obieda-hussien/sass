# bootstrap revision: verified split payload
name: Bootstrap FulfillOS source

on:
  push:
    branches:
      - feature/fulfillos-bootstrap
    paths:
      - .github/workflows/bootstrap-import.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: feature/fulfillos-bootstrap

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-00.b64 bootstrap/part-01.b64 bootstrap/part-02.b64 bootstrap/part-03.b64 bootstrap/part-04.b64 bootstrap/fix05-0.b64 bootstrap/fix05-1.b64 bootstrap/part-06.b64 bootstrap/part-07.b64 bootstrap/part-08.b64 bootstrap/part-09.b64 bootstrap/part-10.b64 bootstrap/fix11-0.b64 bootstrap/fix11-1.b64 > /tmp/fulfillos.b64
          test "$(wc -c < /tmp/fulfillos.b64)" -eq 95564
          base64 --decode /tmp/fulfillos.b64 > /tmp/fulfillos.zip
          set +e
          unzip -t /tmp/fulfillos.zip
          unzip_rc=$?
          set -e
          if [ "$unzip_rc" -gt 1 ]; then exit "$unzip_rc"; fi
          mkdir -p /tmp/fulfillos-src
          set +e
          unzip -q /tmp/fulfillos.zip -d /tmp/fulfillos-src
          unzip_rc=$?
          set -e
          if [ "$unzip_rc" -gt 1 ]; then exit "$unzip_rc"; fi

      - name: Replace bootstrap payload with real project
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/fulfillos-src/. .
          test -f README.md
          test -f backend/app/main.py
          test -f android/app/build.gradle.kts
          test -f .github/workflows/ci.yml

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: import FulfillOS foundation"
          git push origin HEAD:feature/fulfillos-bootstrap
